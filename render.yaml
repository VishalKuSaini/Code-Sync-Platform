# Render Blueprint Specification for Code Sync Platform
# Learn more at: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Backend Service: Express.js & Socket.io Web Service
  # -------------------------------------------------------------
  - type: web
    name: code-sync-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_ENV
        value: production

  # -------------------------------------------------------------
  # 2. Frontend Service: Vite + React Single Page Application (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: code-sync-client
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - client/**
    routes:
      # SPA rewrite rule to ensure React Router paths resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to the public URL of your code-sync-server (e.g., https://code-sync-server.onrender.com)
      - key: VITE_BACKEND_URL
        sync: false
      # Public Piston code execution API endpoint
      - key: VITE_PISTON_API_URL
        value: https://emkc.org/api/v2/piston
