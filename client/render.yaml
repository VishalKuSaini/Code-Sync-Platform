# Render Blueprint Specification for Code Sync Client (Frontend)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: code-sync-client
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - client/**
    routes:
      # Single-Page Application (SPA) rewrite rule for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public URL of your deployed backend (e.g., https://code-sync-server.onrender.com)
      - key: VITE_BACKEND_URL
        sync: false
      # Public Piston code execution API
      - key: VITE_PISTON_API_URL
        value: https://emkc.org/api/v2/piston
