# Render Blueprint Specification for Code Sync Server (Backend)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: code-sync-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: NODE_ENV
        value: production
